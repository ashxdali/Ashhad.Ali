<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Details — Ashhad Ali M P Portfolio</title>
  <meta name="description" content="Detailed engineering case study, system architecture diagram, and photo gallery for projects built by Ashhad Ali M P." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <style>
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .project-header-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .project-header-nav a {
      color: var(--blue);
      text-decoration: none;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 0.9rem;
    }
    .project-container {
      max-width: 1000px;
      margin: 2.5rem auto;
      padding: 0 1.5rem 4rem 1.5rem;
    }
    .project-hero {
      margin-bottom: 2.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      position: relative;
      overflow: hidden;
    }
    .project-badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: rgba(0, 212, 255, 0.1);
      color: var(--cyan);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 50px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .project-title {
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--heading);
      margin-bottom: 0.75rem;
      line-height: 1.25;
    }
    .project-meta {
      font-family: var(--font-mono);
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .gallery-main-container {
      margin-bottom: 2rem;
      background: #05050C;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }
    .gallery-main-img {
      width: 100%;
      max-height: 480px;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .gallery-thumbs-row {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 2.5rem;
    }
    .thumb-card {
      width: 140px;
      height: 90px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .thumb-card.active {
      border-color: var(--blue);
      box-shadow: 0 0 12px rgba(0, 180, 255, 0.4);
    }
    .thumb-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .arch-block {
      background: #080812;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--cyan);
      overflow-x: auto;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
    .highlights-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }
    .highlight-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
    }
  </style>
  <script type="module" crossorigin src="./assets/project-DNXCgQE9.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/portfolioData-D7PaftXn.js">
  <link rel="stylesheet" crossorigin href="./assets/main-BagBpzpL.css">
</head>

      <a href="/#projects">← Back to Portfolio</a>
      <a href="/assets/Ashhad_Ali_Resume.pdf" download="Ashhad_Ali_Resume.pdf" class="btn-ghost" style="padding: 0.4rem 0.9rem; font-size: 0.82rem;">
        <span>📥 Download Resume PDF</span>
      </a>
    </div>
  </header>

  <main class="project-container" id="project-app">
    <div style="text-align: center; padding: 4rem 0; font-family: var(--font-mono); color: var(--muted);">
      Loading Project Case Study...
    </div>
  </main>

</body>
</html>
